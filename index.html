<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resim Çizme Uygulaması</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-paint-brush"></i> Resim Çiz</h1>
            <div class="app-info">Çizin, kaydedin, paylaşın!</div>
        </header>

        <div class="tools-panel">
            <div class="tool-group">
                <button id="brush" class="tool-btn active" title="Fırça">
                    <i class="fas fa-paint-brush"></i>
                </button>
                <button id="eraser" class="tool-btn" title="Silgi">
                    <i class="fas fa-eraser"></i>
                </button>
                <button id="clear" class="tool-btn" title="Temizle">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
            
            <div class="tool-group">
                <input type="color" id="colorPicker" value="#ff0000" title="Renk Seç">
                <div class="slider-container">
                    <i class="fas fa-circle small"></i>
                    <input type="range" id="brushSize" min="1" max="50" value="5" title="Kalınlık">
                    <i class="fas fa-circle large"></i>
                </div>
            </div>
            
            <div class="tool-group">
                <button id="save" class="action-btn save" title="Kaydet">
                    <i class="fas fa-save"></i> Kaydet
                </button>
                <button id="share" class="action-btn share" title="Paylaş">
                    <i class="fas fa-share"></i> Paylaş
                </button>
                <button id="undo" class="tool-btn" title="Geri Al">
                    <i class="fas fa-undo"></i>
                </button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="drawingCanvas">
                Tarayıcınız canvas desteklemiyor.
            </canvas>
        </div>

        <div class="colors-palette">
            <div class="color" style="background-color: #000000;" data-color="#000000"></div>
            <div class="color" style="background-color: #ff0000;" data-color="#ff0000"></div>
            <div class="color" style="background-color: #00ff00;" data-color="#00ff00"></div>
            <div class="color" style="background-color: #0000ff;" data-color="#0000ff"></div>
            <div class="color" style="background-color: #ffff00;" data-color="#ffff00"></div>
            <div class="color" style="background-color: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color" style="background-color: #00ffff;" data-color="#00ffff"></div>
            <div class="color" style="background-color: #ffffff;" data-color="#ffffff"></div>
            <div class="color" style="background-color: #ff9500;" data-color="#ff9500"></div>
            <div class="color" style="background-color: #8e44ad;" data-color="#8e44ad"></div>
        </div>

        <footer>
            <p>Çiziminizi kaydetmek için "Kaydet" butonuna basın</p>
            <p class="hint">İki parmakla yakınlaştırma/uzaklaştırma yapabilirsiniz</p>
        </footer>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2><i class="fas fa-check-circle"></i> Başarılı!</h2>
            <p>Çiziminiz galeriye kaydedildi.</p>
            <button class="modal-btn" id="closeModal">Tamam</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
